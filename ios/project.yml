name: MobileSecurity
options:
  minimumXcodeGenVersion: "2.40.0"
  bundleIdPrefix: com.mobilesecurity
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_NSFaceIDUsageDescription: "MobileSecurity uses Face ID to unlock the app and the family vault."
    INFOPLIST_KEY_CFBundleDisplayName: "MobileSecurity"

targets:
  MobileSecurity:
    type: application
    platform: iOS
    sources:
      - path: MobileSecurity/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mobilesecurity.app
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: MobileSecurity/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
