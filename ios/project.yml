name: OnlyTrusted
options:
  minimumXcodeGenVersion: "2.40.0"
  bundleIdPrefix: com.onlytrusted
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: NO
    # 57Million LLC Apple Developer team — placeholder, unverified against Apple's
    # provisioning service as of 2026-10-20 (Xcode has no Apple ID signed in on this
    # machine, so a device build cannot resolve profiles). Simulator builds work with
    # CODE_SIGNING_ALLOWED=NO regardless. When ready for a real-device build:
    #   1) Xcode → Settings → Accounts → add the Apple ID for 57Million LLC.
    #   2) Confirm the 10-char Team ID matches the string below.
    #   3) xcodegen generate && xcodebuild ... build (drop CODE_SIGNING_ALLOWED=NO).
    DEVELOPMENT_TEAM: "H86SA2C3S5"
    CODE_SIGN_STYLE: Automatic

targets:
  # --- Main app ----------------------------------------------------------------
  OnlyTrusted:
    type: application
    platform: iOS
    sources:
      - path: OnlyTrusted/Sources
      - path: OnlyTrusted/Assets.xcassets
      # Offline Threat Intel (Elite) — bundled .txt / .json feeds loaded at launch.
      # Added as a resource folder so XcodeGen keeps the files in the bundle without
      # trying to compile them. Keep tightly scoped to the four shipping files.
      - path: OnlyTrusted/Data
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlytrusted.app
        CODE_SIGN_ENTITLEMENTS: Entitlements/OnlyTrusted.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: OnlyTrusted/Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "OnlyTrusted uses Face ID to unlock the app and the family vault."
        INFOPLIST_KEY_CFBundleDisplayName: "OnlyTrusted"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: CallDirectoryExtension
      - target: MessageFilterExtension
      - target: SmartLinkGuardExtension

  # --- Call Directory Extension ------------------------------------------------
  CallDirectoryExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CallDirectoryExtension
      - path: OnlyTrusted/Sources/Shared
      - path: OnlyTrusted/Sources/Vault/PhoneUtils.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlytrusted.app.CallDirectoryExtension
        CODE_SIGN_ENTITLEMENTS: Entitlements/CallDirectoryExtension.entitlements
        INFOPLIST_FILE: CallDirectoryExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: "CallDirectoryExtension"
        PRODUCT_MODULE_NAME: CallDirectoryExtension
        INFOPLIST_KEY_CFBundleDisplayName: "OnlyTrusted Call Blocker"

  # --- Message Filter Extension ------------------------------------------------
  MessageFilterExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MessageFilterExtension
      - path: OnlyTrusted/Sources/Shared
      - path: OnlyTrusted/Sources/Vault/PhoneUtils.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlytrusted.app.MessageFilterExtension
        CODE_SIGN_ENTITLEMENTS: Entitlements/MessageFilterExtension.entitlements
        INFOPLIST_FILE: MessageFilterExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: "MessageFilterExtension"
        PRODUCT_MODULE_NAME: MessageFilterExtension
        INFOPLIST_KEY_CFBundleDisplayName: "OnlyTrusted SMS Filter"

  # --- Smart Link Guard Share Extension ----------------------------------------
  # iOS cannot intercept incoming SMS the way Android can, so instead we expose
  # Smart Link Guard as a share destination. The user shares a suspicious URL from
  # Messages / Safari / anywhere and this extension renders the on-device verdict
  # with Open / Cancel buttons. Shares the rules file with the main app target.
  SmartLinkGuardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SmartLinkGuardExtension
      - path: OnlyTrusted/Sources/SmartLinkGuard/SmartLinkGuardRules.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlytrusted.app.SmartLinkGuardExtension
        CODE_SIGN_ENTITLEMENTS: Entitlements/SmartLinkGuardExtension.entitlements
        INFOPLIST_FILE: SmartLinkGuardExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: "SmartLinkGuardExtension"
        PRODUCT_MODULE_NAME: SmartLinkGuardExtension
        INFOPLIST_KEY_CFBundleDisplayName: "OnlyTrusted Smart Link Guard"
